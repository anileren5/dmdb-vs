services:
  dmdb-vs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dmdb-vs
    working_dir: /workspace
    ports:
      - "8888:8888"
    volumes:
      - ./:/workspace
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=
